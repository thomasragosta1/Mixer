name: Fauna

on:
  push:
    paths:
      - "Fauna/**"
      - .github/workflows/fauna.yml
  workflow_dispatch:

concurrency:
  group: fauna-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build and screenshot
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check content
        run: python3 Fauna/scripts/validate_content.py

      - name: Resolve photos and credits
        run: python3 Fauna/scripts/fetch_photos.py

      - name: Select Xcode
        run: |
          XC=""
          for v in 27 26 16; do
            XC=$(ls -d /Applications/Xcode_$v*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
            [ -n "$XC" ] && break
          done
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Build for the simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']))")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          set +e
          xcodebuild build \
            -project Fauna/Fauna.xcodeproj \
            -scheme Fauna \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "error:|warning: .*Fauna/|BUILD (SUCCEEDED|FAILED)"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" != "0" ]; then
            echo "---- errors with context ----"
            grep -B2 -A6 "error:" build.log | head -300
            exit 1
          fi

      - name: Screenshots
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/Fauna.app
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          shot() {
            name=$1; shift
            xcrun simctl terminate "$UDID" com.fauna.daily 2>/dev/null || true
            xcrun simctl launch "$UDID" com.fauna.daily "$@" >/dev/null
            sleep 12
            xcrun simctl io "$UDID" screenshot "shots/$name.png" >/dev/null 2>&1
            echo "shot $name"
          }
          shot 1-onboarding -FaunaOnboarding
          shot 2-today -FaunaDemo
          shot 3-facts -FaunaDemo -FaunaScrollTo facts
          shot 4-didyouknow -FaunaDemo -FaunaScrollTo didYouKnow
          shot 5-help -FaunaDemo -FaunaScrollTo help
          shot 6-unlock -FaunaDemo -FaunaScrollTo unlock
          shot 7-quiz -FaunaDemo -FaunaQuiz
          shot 8-journal -FaunaDemo -FaunaTab journal
          shot 9-focus -FaunaDemo -FaunaTab focus
          xcrun simctl ui "$UDID" appearance dark
          shot 10-today-dark -FaunaDemo -FaunaScrollTo facts
          shot 11-journal-dark -FaunaDemo -FaunaTab journal

      - name: Contact sheet
        run: |
          python3 -m pip install --quiet --break-system-packages pillow 2>/dev/null || python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          import glob, base64, io, re
          files = sorted(glob.glob("shots/*.png"), key=lambda p: int(re.search(r"/(\d+)-", p).group(1)))
          ims = [Image.open(f).convert("RGB") for f in files]
          w = 300
          ims = [im.resize((w, int(im.height * w / im.width))) for im in ims]
          h = max(im.height for im in ims)
          cols = 6
          rows = (len(ims) + cols - 1) // cols
          sheet = Image.new("RGB", (cols * (w + 8), rows * (h + 8)), "white")
          for i, im in enumerate(ims):
              sheet.paste(im, ((i % cols) * (w + 8), (i // cols) * (h + 8)))
          sheet.save("shots/contact-sheet.jpg", quality=80)
          PY

      # Commit downsized screenshots so they can be reviewed in the repo (pushes made with
      # GITHUB_TOKEN don't start new workflow runs).
      - name: Commit screenshots
        if: github.event_name == 'push'
        run: |
          mkdir -p Fauna/docs/screenshots
          for f in shots/*.png; do sips -Z 1100 "$f" --out "Fauna/docs/screenshots/$(basename "$f")" >/dev/null; done
          cp shots/contact-sheet.jpg Fauna/docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Fauna/docs/screenshots Fauna/Fauna/Resources/photos.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Fauna: update screenshots [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fauna-screenshots
          path: shots/
          if-no-files-found: ignore

  # Archives Fauna and uploads it to TestFlight with the same App Store Connect API key
  # the FourTrack workflow uses. The bundle ID is FAUNA_BUNDLE_ID if set, otherwise
  # derived from FourTrack's BUNDLE_ID (last part replaced with "fauna").
  testflight:
    name: TestFlight
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
      FAUNA_BUNDLE_ID: ${{ secrets.FAUNA_BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up API key and bundle ID
        run: |
          trim() { printf '%s' "$1" | tr -d '[:space:]'; }
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -z "${!v}" ] && { echo "::error::Missing secret $v"; exit 1; }
          done
          ID=$(trim "$FAUNA_BUNDLE_ID")
          if [ -z "$ID" ]; then
            BASE=$(trim "$BUNDLE_ID")
            [ -z "$BASE" ] && { echo "::error::Set a FAUNA_BUNDLE_ID secret"; exit 1; }
            ID="${BASE%.*}.fauna"
            [ "$ID" = "$BASE" ] && ID="$BASE.fauna"
          fi
          KEY_ID=$(trim "$ASC_KEY_ID")
          {
            echo "KEY_ID=$KEY_ID"
            echo "ISSUER_ID=$(trim "$ASC_ISSUER_ID")"
            echo "TEAM_ID=$(trim "$APPLE_TEAM_ID")"
            echo "FAUNA_ID=$ID"
            echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/keys"
          KEY_FILE="$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' | sed '/^[[:space:]]*$/d' > "$KEY_FILE"
          if [ "$(wc -l < "$KEY_FILE")" -lt 3 ]; then
            body=$(tr -d '\n' < "$KEY_FILE" | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' | tr -d '[:space:]')
            { echo "-----BEGIN PRIVATE KEY-----"; echo "$body" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$KEY_FILE"
          fi
          echo "Fauna bundle ID (spelled out): $(echo "$ID" | sed 's/./& /g')"

      - name: Register the bundle ID and check the App Store Connect app
        id: asc
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install --quiet pyjwt cryptography
          python3 - <<'PY'
          import json, os, sys, time, urllib.request, urllib.error, jwt
          key = open(os.environ["KEY_PATH"]).read()
          token = jwt.encode({"iss": os.environ["ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 1100,
                              "aud": "appstoreconnect-v1"}, key, algorithm="ES256", headers={"kid": os.environ["KEY_ID"], "typ": "JWT"})
          H = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
          def call(method, path, body=None):
              req = urllib.request.Request("https://api.appstoreconnect.apple.com" + path, method=method, headers=H,
                                           data=json.dumps(body).encode() if body else None)
              try:
                  return json.load(urllib.request.urlopen(req))
              except urllib.error.HTTPError as e:
                  print(f"{method} {path.split('?')[0]}: HTTP {e.code} {e.read().decode()[:400]}")
                  return None
          fid = os.environ["FAUNA_ID"]
          spelled = " ".join(fid)
          try:
              urllib.request.urlopen(urllib.request.Request("https://api.appstoreconnect.apple.com/v1/apps?limit=1", headers=H))
          except urllib.error.HTTPError as e:
              if "REQUIRED_AGREEMENTS" in e.read().decode():
                  print("::error::Apple needs the account holder to accept an updated agreement: "
                        "appstoreconnect.apple.com -> Business (or the Agreements banner). Then re-run this workflow.")
                  sys.exit(1)
          ids = call("GET", "/v1/bundleIds?limit=200&filter[identifier]=" + fid) or {"data": []}
          if not any(b["attributes"]["identifier"] == fid for b in ids["data"]):
              r = call("POST", "/v1/bundleIds", {"data": {"type": "bundleIds", "attributes": {
                  "identifier": fid, "name": "Fauna", "platform": "IOS"}}})
              print("Registered App ID." if r else "::warning::Couldn't register the App ID")
          apps = (call("GET", "/v1/apps?limit=200&fields[apps]=name,bundleId") or {"data": []})["data"]
          if not any(a["attributes"]["bundleId"] == fid for a in apps):
              print(f"::error::Create the Fauna app in App Store Connect first: appstoreconnect.apple.com -> Apps -> + -> New App, "
                    f"platform iOS, name Fauna, bundle ID: {spelled} (without spaces), SKU fauna. Then re-run this workflow.")
              sys.exit(1)
          print(f"App Store Connect app found for {spelled}")
          PY

      - name: Resolve photos and credits
        run: python3 Fauna/scripts/fetch_photos.py

      - name: Select Xcode
        run: |
          XC=""
          for v in 27 26; do
            XC=$(ls -d /Applications/Xcode_$v*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
            [ -n "$XC" ] && break
          done
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild \
            -project Fauna/Fauna.xcodeproj \
            -scheme Fauna \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Fauna.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$FAUNA_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Fauna.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" 2>&1 | grep -E "error:|EXPORT"
          ls "$RUNNER_TEMP"/export/*.ipa

      - name: Upload to TestFlight
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$KEY_PATH" ~/.appstoreconnect/private_keys/
          xcrun altool --upload-app --type ios --file "$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" --output-format normal
          echo "::notice::Fauna build ${{ github.run_number }} uploaded. It shows up in TestFlight after Apple processes it (usually 10-30 minutes)."

      - name: Give the team's internal testers every build
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error, jwt
          key = open(os.environ["KEY_PATH"]).read()
          token = jwt.encode({"iss": os.environ["ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 1100,
                              "aud": "appstoreconnect-v1"}, key, algorithm="ES256", headers={"kid": os.environ["KEY_ID"], "typ": "JWT"})
          H = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
          def call(method, path, body=None):
              req = urllib.request.Request("https://api.appstoreconnect.apple.com" + path, method=method, headers=H,
                                           data=json.dumps(body).encode() if body else None)
              try:
                  r = urllib.request.urlopen(req); t = r.read(); return json.loads(t) if t else {}
              except urllib.error.HTTPError as e:
                  print(f"{method} {path.split('?')[0]}: HTTP {e.code} {e.read().decode()[:300]}"); return None
          fid = os.environ["FAUNA_ID"]
          app = [a for a in call("GET", "/v1/apps?limit=200")["data"] if a["attributes"]["bundleId"] == fid][0]
          groups = (call("GET", f"/v1/apps/{app['id']}/betaGroups") or {"data": []})["data"]
          internal = [g for g in groups if g["attributes"].get("isInternalGroup")]
          if internal:
              gid = internal[0]["id"]
          else:
              g = call("POST", "/v1/betaGroups", {"data": {"type": "betaGroups",
                  "attributes": {"name": "Team", "isInternalGroup": True, "hasAccessToAllBuilds": True},
                  "relationships": {"app": {"data": {"type": "apps", "id": app["id"]}}}}})
              gid = g["data"]["id"] if g else None
              print("Created internal group 'Team'." if gid else "Couldn't create a group")
          if gid:
              users = (call("GET", "/v1/users?limit=50") or {"data": []})["data"]
              for u in users:
                  a = u["attributes"]
                  r = call("POST", "/v1/betaTesters", {"data": {"type": "betaTesters",
                      "attributes": {"email": a["username"], "firstName": a.get("firstName") or "", "lastName": a.get("lastName") or ""},
                      "relationships": {"betaGroups": {"data": [{"type": "betaGroups", "id": gid}]}}}})
                  print("Added a team member to internal testing." if r else "Tester not added (may already be in the group).")
          PY

  # Pulls TestFlight feedback (comments + screenshots, no emails) into Fauna/docs/feedback/.
  feedback:
    name: TestFlight feedback
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
      FAUNA_BUNDLE_ID: ${{ secrets.FAUNA_BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch feedback
        run: |
          python3 -m pip install --quiet pyjwt cryptography
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error, jwt, pathlib
          trim = lambda s: "".join((s or "").split())
          key = (os.environ["ASC_KEY_P8"] or "").replace("\r", "")
          if "\n" not in key.strip():
              body = key.replace("-----BEGIN PRIVATE KEY-----", "").replace("-----END PRIVATE KEY-----", "").replace(" ", "")
              key = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(body[i:i+64] for i in range(0, len(body), 64)) + "\n-----END PRIVATE KEY-----\n"
          token = jwt.encode({"iss": trim(os.environ["ASC_ISSUER_ID"]), "iat": int(time.time()), "exp": int(time.time()) + 1100,
                              "aud": "appstoreconnect-v1"}, key, algorithm="ES256", headers={"kid": trim(os.environ["ASC_KEY_ID"]), "typ": "JWT"})
          H = {"Authorization": f"Bearer {token}"}
          def get(path):
              try:
                  return json.load(urllib.request.urlopen(urllib.request.Request("https://api.appstoreconnect.apple.com" + path, headers=H)))
              except urllib.error.HTTPError as e:
                  print(f"GET {path.split('?')[0]}: HTTP {e.code} {e.read().decode()[:300]}"); return None
          fid = trim(os.environ.get("FAUNA_BUNDLE_ID"))
          if not fid:
              base = trim(os.environ["BUNDLE_ID"]); fid = base.rsplit(".", 1)[0] + ".fauna"
          app = [a for a in get("/v1/apps?limit=200")["data"] if a["attributes"]["bundleId"] == fid][0]
          out = pathlib.Path("Fauna/docs/feedback"); out.mkdir(parents=True, exist_ok=True)
          lines = ["# Fauna TestFlight feedback", ""]
          shots = get(f"/v1/apps/{app['id']}/betaFeedbackScreenshotSubmissions?limit=50&include=build") or {"data": []}
          builds = {b["id"]: b["attributes"].get("version") for b in shots.get("included", []) if b["type"] == "builds"}
          for f in shots["data"]:
              a = f["attributes"]
              rel = ((f.get("relationships") or {}).get("build") or {}).get("data") or {}
              b = builds.get(rel.get("id"), "?")
              print(f"--- {a.get('createdDate')} build {b} {a.get('deviceModel')} iOS {a.get('osVersion')}")
              print("Comment:", a.get("comment") or "(none)")
              lines += [f"## {a.get('createdDate')} (build {b}, {a.get('deviceModel')}, iOS {a.get('osVersion')})", "", a.get("comment") or "(no comment)", ""]
              for i, s in enumerate(a.get("screenshots") or []):
                  name = f"{f['id']}-{i}.jpg"
                  try:
                      urllib.request.urlretrieve(s["url"], out / name)
                      lines += [f"![screenshot]({name})", ""]
                      print("Screenshot saved:", name)
                  except Exception as e:
                      print("Screenshot download failed:", e)
          crashes = get(f"/v1/apps/{app['id']}/betaFeedbackCrashSubmissions?limit=50") or {"data": []}
          for f in crashes["data"]:
              a = f["attributes"]
              print(f"--- CRASH {a.get('createdDate')} {a.get('deviceModel')} iOS {a.get('osVersion')}: {a.get('comment') or '(no comment)'}")
              lines += [f"## Crash {a.get('createdDate')} ({a.get('deviceModel')}, iOS {a.get('osVersion')})", "", a.get("comment") or "(no comment)", ""]
          print(f"{len(shots['data'])} screenshot feedback, {len(crashes['data'])} crash feedback")
          (out / "README.md").write_text("\n".join(lines) + "\n")
          PY
      - name: Commit feedback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Fauna/docs/feedback
          if git diff --cached --quiet; then echo "No new feedback"; exit 0; fi
          git commit -m "Fauna: TestFlight feedback [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
