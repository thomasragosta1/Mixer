name: iOS

on:
  push:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to TestFlight
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Core package tests
        working-directory: Packages/FourTrackCore
        run: swift test

      - name: Build app (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project FourTrack.xcodeproj \
            -scheme FourTrack \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*FourTrack/|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

  testflight:
    name: Upload to TestFlight
    needs: build
    runs-on: macos-15
    timeout-minutes: 60
    # Every push to the working branch ships a build once the secrets exist;
    # manual runs can opt out with the "upload" input.
    if: github.event_name == 'push' || inputs.upload
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID BUNDLE_ID; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Skipping TestFlight upload; missing secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - name: Write API key
        if: steps.secrets.outputs.ready == 'true'
        run: |
          # Secrets pasted on a phone often carry stray spaces or line breaks.
          trim() { printf '%s' "$1" | tr -d '[:space:]'; }
          KEY_ID=$(trim "$ASC_KEY_ID")
          {
            echo "KEY_ID=$KEY_ID"
            echo "ISSUER_ID=$(trim "$ASC_ISSUER_ID")"
            echo "TEAM_ID=$(trim "$APPLE_TEAM_ID")"
            echo "APP_BUNDLE_ID=$(trim "$BUNDLE_ID")"
            echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/keys"
          # Keep the PEM lines; drop carriage returns and surrounding blank lines.
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' | sed '/^[[:space:]]*$/d' > "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"
          KEY_FILE="$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"
          grep -q "BEGIN PRIVATE KEY" "$KEY_FILE" || { echo "::error::ASC_KEY_P8 must include the -----BEGIN PRIVATE KEY----- line"; exit 1; }
          # If the paste collapsed the key onto one line, rebuild proper PEM.
          if [ "$(wc -l < "$KEY_FILE")" -lt 3 ]; then
            body=$(tr -d '\n' < "$KEY_FILE" | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' | tr -d '[:space:]')
            { echo "-----BEGIN PRIVATE KEY-----"; echo "$body" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$KEY_FILE"
          fi
          openssl pkey -in "$KEY_FILE" -noout && echo "API key file is valid."

      - name: Archive
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -o pipefail
          xcodebuild \
            -project FourTrack.xcodeproj \
            -scheme FourTrack \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FourTrack.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive 2>&1 | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      - name: Export IPA
        if: steps.secrets.outputs.ready == 'true'
        run: |
          echo "Archived bundle ID: $(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleIdentifier' "$RUNNER_TEMP/FourTrack.xcarchive/Info.plist")"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/FourTrack.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            || { find /var/folders -name "*.xcdistributionlogs" -maxdepth 6 2>/dev/null | head -1 | xargs -I{} sh -c 'cat "{}"/IDEDistribution.standard.log | tail -60'; exit 1; }
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to App Store Connect
        if: steps.secrets.outputs.ready == 'true'
        run: |
          # altool finds the key by ID in this folder.
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$KEY_PATH" ~/.appstoreconnect/private_keys/
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" --output-format normal
          echo "::notice::Build ${{ github.run_number }} uploaded. It appears in TestFlight after Apple finishes processing (usually 10-30 minutes)."
