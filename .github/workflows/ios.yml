name: iOS

on:
  push:
    # Doc-only changes don't need a build.
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to TestFlight
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The core package is platform-independent: test it on Linux, where a CI
  # minute counts once instead of ten times on macOS.
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:5.10-jammy
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Core package tests
        working-directory: Packages/FourTrackCore
        run: swift test

  # One macOS job: app tests in the simulator, then (on pushes) archive and
  # upload. One runner and one checkout instead of two; the simulator test
  # builds the app once instead of a separate build step.
  ios:
    name: App tests and TestFlight
    needs: core
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
      # Every push ships a build; manual runs can opt out with the "upload" input.
      SHIP: ${{ github.event_name == 'push' || inputs.upload }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -z "$XC" ] && XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "::error::No Xcode 26 on this runner"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: App tests in the simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Simulator: $UDID"
          set +e
          xcodebuild test \
            -project FourTrack.xcodeproj \
            -scheme FourTrack \
            -destination "id=$UDID" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= 2>&1 | tee test.log | grep -E "error:|Test Case|crash|Terminating|exception|TEST (SUCCEEDED|FAILED)|\*\* TEST"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" != "0" ]; then
            echo "---- crash reports ----"
            for f in $(ls -t ~/Library/Logs/DiagnosticReports/*FourTrack* 2>/dev/null | head -3); do echo "== $f"; head -c 60000 "$f"; done
            echo "---- log tail ----"; tail -120 test.log
            exit 1
          fi

      - name: Check secrets
        id: secrets
        run: |
          if [ "$SHIP" != "true" ]; then echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID BUNDLE_ID; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Skipping TestFlight upload; missing secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write API key
        if: steps.secrets.outputs.ready == 'true'
        run: |
          # Secrets pasted on a phone often carry stray spaces or line breaks.
          trim() { printf '%s' "$1" | tr -d '[:space:]'; }
          KEY_ID=$(trim "$ASC_KEY_ID")
          {
            echo "KEY_ID=$KEY_ID"
            echo "ISSUER_ID=$(trim "$ASC_ISSUER_ID")"
            echo "TEAM_ID=$(trim "$APPLE_TEAM_ID")"
            echo "APP_BUNDLE_ID=$(trim "$BUNDLE_ID")"
            echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/keys"
          # Keep the PEM lines; drop carriage returns and surrounding blank lines.
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' | sed '/^[[:space:]]*$/d' > "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"
          KEY_FILE="$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"
          grep -q "BEGIN PRIVATE KEY" "$KEY_FILE" || { echo "::error::ASC_KEY_P8 must include the -----BEGIN PRIVATE KEY----- line"; exit 1; }
          # If the paste collapsed the key onto one line, rebuild proper PEM.
          if [ "$(wc -l < "$KEY_FILE")" -lt 3 ]; then
            body=$(tr -d '\n' < "$KEY_FILE" | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' | tr -d '[:space:]')
            { echo "-----BEGIN PRIVATE KEY-----"; echo "$body" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$KEY_FILE"
          fi
          openssl pkey -in "$KEY_FILE" -noout && echo "API key file is valid."

      - name: Archive
        if: steps.secrets.outputs.ready == 'true'
        # Archived unsigned. Export signs it with Apple's cloud-managed
        # distribution certificate through the API key, so the runner never
        # creates (and uses up) development or distribution certificates.
        run: |
          set -o pipefail
          xcodebuild \
            -project FourTrack.xcodeproj \
            -scheme FourTrack \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FourTrack.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log
          APP="$RUNNER_TEMP/FourTrack.xcarchive/Products/Applications/FourTrack.app"
          echo "Drum samples in app:"; ls "$APP/Drums/studio" "$APP/Drums/studio-tight" "$APP/Drums/hand" | head -60
          test -f "$APP/Drums/studio/0_1.caf" && test -f "$APP/Drums/studio-tight/7_2.caf" && test -f "$APP/Drums/hand/7_2.caf" || { echo "::error::Drum samples missing from the app bundle"; exit 1; }

      - name: Export IPA
        if: steps.secrets.outputs.ready == 'true'
        run: |
          echo "Archived bundle ID: $(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleIdentifier' "$RUNNER_TEMP/FourTrack.xcarchive/Info.plist")"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/FourTrack.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            || { find /var/folders -name "*.xcdistributionlogs" -maxdepth 6 2>/dev/null | head -1 | xargs -I{} sh -c 'cat "{}"/IDEDistribution.standard.log | tail -60'; exit 1; }
          ls -la "$RUNNER_TEMP/export"

      - name: Check App Store Connect app record
        if: steps.secrets.outputs.ready == 'true'
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install --quiet pyjwt cryptography
          python3 - <<'PY'
          import json, os, sys, time, urllib.request, jwt
          key = open(os.environ["KEY_PATH"]).read()
          token = jwt.encode(
              {"iss": os.environ["ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
              key, algorithm="ES256", headers={"kid": os.environ["KEY_ID"], "typ": "JWT"})
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/apps?limit=50&fields[apps]=name,bundleId",
                                       headers={"Authorization": f"Bearer {token}"})
          apps = json.load(urllib.request.urlopen(req))["data"]
          wanted = os.environ["APP_BUNDLE_ID"]
          print(f"Apps visible to this API key ({len(apps)}):")
          for a in apps:
              b = a["attributes"]["bundleId"]
              # Spell out with spaces so GitHub's secret masking doesn't hide it.
              print(f'  - {a["attributes"]["name"]}: {" ".join(b)}{"   <-- matches BUNDLE_ID" if b == wanted else ""}')
          print(f'BUNDLE_ID secret (spelled out): {" ".join(wanted)}')
          if not any(a["attributes"]["bundleId"] == wanted for a in apps):
              print("::error::No App Store Connect app uses the BUNDLE_ID secret. Fix the secret or the app's bundle ID.")
              sys.exit(1)
          PY

      - name: Upload to App Store Connect
        if: steps.secrets.outputs.ready == 'true'
        run: |
          # altool finds the key by ID in this folder.
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$KEY_PATH" ~/.appstoreconnect/private_keys/
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" --output-format normal
          echo "::notice::Build ${{ github.run_number }} uploaded. It appears in TestFlight after Apple finishes processing (usually 10-30 minutes)."
