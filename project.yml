name: FourTrack
options:
  bundleIdPrefix: com.fourtrack
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer team here (or in Xcode > Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  FourTrackCore:
    path: Packages/FourTrackCore

targets:
  FourTrack:
    type: application
    platform: iOS
    sources:
      - path: FourTrack
    dependencies:
      - package: FourTrackCore
        product: FourTrackCore
    info:
      path: FourTrack/Resources/Info.plist
      properties:
        CFBundleDisplayName: Four-Track
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        NSMicrophoneUsageDescription: Four-Track records your voice and instruments onto its tracks.
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fourtrack.app
        PRODUCT_NAME: FourTrack
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

schemes:
  FourTrack:
    build:
      targets:
        FourTrack: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: FourTrackCore/FourTrackCoreTests
    archive:
      config: Release
